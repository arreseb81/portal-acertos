<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de Acertos — Portal DIGEP/IBRAM</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16324F; --slate:#3D5A73; --gold:#B8912B;
    --paper:#F4F2ED; --paper-dark:#EAE6DC; --ink:#1B1B18; --ink-soft:#5B5B54; --line:#D8D3C6;
    --green:#3E7A4C; --red:#B23B3B;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; }
  header.top{ background:var(--navy); color:#fff; padding:1.8rem 1.5rem 1.6rem; border-bottom:4px solid var(--gold); }
  .top-inner{ max-width:1000px; margin:0 auto; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:0.8rem; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color:#C9D3DC; margin-bottom:0.5rem; }
  h1{ font-family:'Source Serif 4',serif; font-weight:600; font-size:1.6rem; margin:0; }
  a.voltar{ color:#C9D3DC; font-size:0.82rem; text-decoration:none; }
  a.voltar:hover{ color:#fff; }

  main{ max-width:1000px; margin:0 auto; padding:1.8rem 1.5rem 4rem; }

  .filtros{
    display:flex; gap:0.8rem; flex-wrap:wrap; align-items:flex-end;
    background:#fff; border:1px solid var(--line); border-radius:6px; padding:1rem 1.2rem; margin-bottom:1.4rem;
  }
  .campo{ display:flex; flex-direction:column; gap:0.3rem; }
  .campo label{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); }
  .campo select, .campo input{
    padding:0.5rem 0.6rem; border:1px solid var(--line); border-radius:4px; font-size:0.88rem; font-family:inherit; min-width:180px;
  }
  .campo.busca input{ min-width:220px; }

  .status-linha{ font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--ink-soft); margin-bottom:1rem; }

  table.lista{ width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  table.lista th{
    text-align:left; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft);
    background:var(--paper-dark); padding:0.6rem 0.9rem; border-bottom:1px solid var(--line);
  }
  table.lista td{ padding:0.65rem 0.9rem; border-bottom:1px solid var(--line); font-size:0.9rem; }
  table.lista tbody tr{ cursor:pointer; transition:background .1s ease; }
  table.lista tbody tr:hover{ background:var(--paper-dark); }
  table.lista tbody tr:last-child td{ border-bottom:none; }

  .badge{
    font-family:'IBM Plex Mono',monospace; font-size:0.68rem; letter-spacing:0.04em;
    background:var(--paper-dark); color:var(--slate); padding:0.15rem 0.45rem; border-radius:3px; white-space:nowrap;
  }
  .vazio{ text-align:center; padding:2.5rem 1rem; color:var(--ink-soft); font-size:0.9rem; }

  /* ---- painel de detalhe ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(27,27,24,0.45); display:none;
    align-items:flex-start; justify-content:center; padding:3rem 1rem; z-index:50; overflow-y:auto;
  }
  .overlay.aberto{ display:flex; }
  .painel{
    background:#fff; border-radius:8px; max-width:680px; width:100%; padding:1.8rem 2rem 2rem;
    border-top:4px solid var(--gold);
  }
  .painel-topo{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem; }
  .painel h2{ font-family:'Source Serif 4',serif; font-size:1.25rem; margin:0.3rem 0 0.2rem; }
  .fechar{ background:none; border:none; font-size:1.4rem; cursor:pointer; color:var(--ink-soft); line-height:1; }
  .campos-servidor{ display:grid; grid-template-columns:1fr 1fr; gap:0.6rem 1.2rem; margin-bottom:1.2rem; font-size:0.88rem; }
  .campos-servidor div span.lbl{ display:block; font-size:0.7rem; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.04em; }

  table.detalhe{ width:100%; border-collapse:collapse; margin-bottom:1rem; }
  table.detalhe th{ text-align:left; font-size:0.72rem; text-transform:uppercase; color:var(--ink-soft); border-bottom:1px solid var(--line); padding:0.4rem 0.3rem; }
  table.detalhe td{ padding:0.4rem 0.3rem; border-bottom:1px solid var(--paper-dark); font-size:0.85rem; }
  table.detalhe td:last-child{ text-align:right; font-family:'IBM Plex Mono',monospace; }

  .total-linha{ display:flex; justify-content:space-between; font-weight:600; font-size:1rem; padding-top:0.6rem; border-top:2px solid var(--ink); margin-bottom:1.4rem; }

  .painel-acoes{ display:flex; gap:0.6rem; }
  .painel-acoes button{
    font-family:inherit; font-size:0.85rem; padding:0.55rem 1rem; border-radius:4px; cursor:pointer; border:1px solid var(--line);
    background:var(--paper-dark);
  }
  .painel-acoes button.principal{ background:var(--navy); color:#fff; border-color:var(--navy); }

  .meta-registro{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--ink-soft); margin-top:1rem; }

  @media print{
    header.top, .filtros, .status-linha, table.lista, .overlay{ }
    body *{ visibility:hidden; }
    .overlay.aberto, .overlay.aberto *{ visibility:visible; }
    .overlay{ position:absolute; inset:auto; padding:0; background:none; }
    .painel{ border:none; box-shadow:none; max-width:100%; }
    .painel-acoes{ display:none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div>
      <div class="eyebrow">DIGEP · ASPAG — IBRAM-DF</div>
      <h1>Histórico de Acertos</h1>
    </div>
    <div style="display:flex;gap:1rem;align-items:center;">
      <span id="login-text-h" style="color:#C9D3DC;font-size:0.82rem;"></span>
      <a class="voltar" href="#" id="btn-sair-h">Sair</a>
      <a class="voltar" href="../index.html">&larr; voltar ao portal</a>
    </div>
  </div>
</header>

<main>
  <div class="filtros">
    <div class="campo">
      <label for="f-tipo">Tipo de acerto</label>
      <select id="f-tipo">
        <option value="">Todos os tipos</option>
        <option value="brigadista">Brigadista (Grupo 54)</option>
        <option value="comissionado_sem_vinculo">Comissionado sem vínculo</option>
        <option value="comissionado_com_vinculo">Comissionado com vínculo</option>
        <option value="efetivo">Servidor efetivo</option>
      </select>
    </div>
    <div class="campo busca">
      <label for="f-busca">Buscar por nome ou matrícula</label>
      <input id="f-busca" type="text" placeholder="Digite para filtrar...">
    </div>
  </div>

  <div class="status-linha" id="status-linha">carregando acertos…</div>

  <table class="lista">
    <thead>
      <tr>
        <th>Tipo</th>
        <th>Matrícula</th>
        <th>Nome</th>
        <th>Total</th>
        <th>Salvo em</th>
      </tr>
    </thead>
    <tbody id="lista-body"></tbody>
  </table>
</main>

<div class="overlay" id="overlay">
  <div class="painel" id="painel-impressao">
    <div class="painel-topo">
      <div>
        <span class="badge" id="d-badge"></span>
        <h2 id="d-nome">—</h2>
      </div>
      <button class="fechar" id="btn-fechar" aria-label="Fechar">&times;</button>
    </div>

    <div class="campos-servidor" id="d-campos"></div>

    <table class="detalhe">
      <thead><tr><th>Código</th><th>Descrição</th><th>Valor</th></tr></thead>
      <tbody id="d-linhas"></tbody>
    </table>

    <div class="total-linha">
      <span>Total</span>
      <span id="d-total">—</span>
    </div>

    <div class="painel-acoes">
      <button class="principal" id="btn-imprimir-detalhe">Imprimir esta tela</button>
      <button id="btn-excluir-detalhe" style="color:var(--red);border-color:var(--red);">Excluir este acerto</button>
      <button id="btn-fechar-2">Fechar</button>
    </div>

    <div class="meta-registro" id="d-meta"></div>
  </div>
</div>

<script type="module">
  import { exigirLogin, listarTodos, excluirAcerto, logout } from '../assets/firebase-init.js';

  const TIPO_LABEL = {
    brigadista: 'GRUPO 54',
    comissionado_sem_vinculo: 'CC · SEM VÍNCULO',
    comissionado_com_vinculo: 'CC · COM VÍNCULO',
    efetivo: 'EFETIVO'
  };
  const TIPO_NOME = {
    brigadista: 'Brigadista (Grupo 54)',
    comissionado_sem_vinculo: 'Comissionado sem vínculo',
    comissionado_com_vinculo: 'Comissionado com vínculo',
    efetivo: 'Servidor efetivo'
  };

  let todosAcertos = [];
  let registroSelecionado = null;

  exigirLogin(async (usuario) => {
    document.getElementById('login-text-h').textContent = usuario.email;
    await carregar();
  });

  document.getElementById('btn-sair-h').addEventListener('click', async (e) => {
    e.preventDefault();
    await logout();
    window.location.href = '../login.html';
  });

  async function carregar() {
    const status = document.getElementById('status-linha');
    try {
      todosAcertos = await listarTodos();
      status.textContent = `${todosAcertos.length} acerto(s) encontrado(s).`;
      renderizarLista();
    } catch (err) {
      status.textContent = 'Erro ao carregar: ' + err.message;
    }
  }

  // Normaliza os campos, já que os 4 tipos guardam os dados com nomes um pouco diferentes
  function normalizar(registro) {
    const d = registro.dados || {};
    return {
      nome: d.nome || '(sem nome)',
      matricula: d.matricula || '—',
      cargo: d.cargo || '',
      processoSei: d.processoSei || '',
      nascimento: d.nascimento || '',
      admissao: d.admissao || '',
      exoneracao: d.exoneracao || '',
      total: d.totalFinal || d.totalGeral || '—',
      linhas: d.rubricas || d.resumo || []
    };
  }

  function passaNoFiltro(registro, tipo, busca) {
    if (tipo && registro.tipo !== tipo) return false;
    if (!busca) return true;
    const n = normalizar(registro);
    const alvo = (n.nome + ' ' + n.matricula).toLowerCase();
    return alvo.includes(busca.toLowerCase());
  }

  function renderizarLista() {
    const tipo = document.getElementById('f-tipo').value;
    const busca = document.getElementById('f-busca').value.trim();
    const corpo = document.getElementById('lista-body');
    corpo.innerHTML = '';

    const filtrados = todosAcertos.filter(r => passaNoFiltro(r, tipo, busca));

    if (filtrados.length === 0) {
      corpo.innerHTML = `<tr><td colspan="5"><div class="vazio">Nenhum acerto encontrado com esse filtro.</div></td></tr>`;
      return;
    }

    filtrados.forEach((registro) => {
      const n = normalizar(registro);
      const dataFmt = registro.criadoEm && registro.criadoEm.toDate
        ? registro.criadoEm.toDate().toLocaleString('pt-BR')
        : '—';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="badge">${TIPO_LABEL[registro.tipo] || registro.tipo}</span></td>
        <td>${n.matricula}</td>
        <td>${n.nome}</td>
        <td>${n.total}</td>
        <td>${dataFmt}</td>
      `;
      tr.addEventListener('click', () => abrirDetalhe(registro));
      corpo.appendChild(tr);
    });
  }

  function abrirDetalhe(registro) {
    registroSelecionado = registro;
    const n = normalizar(registro);

    document.getElementById('d-badge').textContent = TIPO_NOME[registro.tipo] || registro.tipo;
    document.getElementById('d-nome').textContent = n.nome;
    document.getElementById('d-total').textContent = n.total;

    const camposHtml = [];
    camposHtml.push(`<div><span class="lbl">Matrícula</span>${n.matricula}</div>`);
    if (n.cargo) camposHtml.push(`<div><span class="lbl">Cargo</span>${n.cargo}</div>`);
    if (n.processoSei) camposHtml.push(`<div><span class="lbl">Processo SEI</span>${n.processoSei}</div>`);
    if (n.nascimento) camposHtml.push(`<div><span class="lbl">Nascimento</span>${n.nascimento}</div>`);
    if (n.admissao) camposHtml.push(`<div><span class="lbl">Admissão</span>${n.admissao}</div>`);
    if (n.exoneracao) camposHtml.push(`<div><span class="lbl">Exoneração</span>${n.exoneracao}</div>`);
    document.getElementById('d-campos').innerHTML = camposHtml.join('');

    const linhasHtml = n.linhas.map(l =>
      `<tr><td>${l.codigo || ''}</td><td>${l.descricao || ''}</td><td>${l.valor || ''}</td></tr>`
    ).join('');
    document.getElementById('d-linhas').innerHTML = linhasHtml || '<tr><td colspan="3">Sem linhas de detalhamento salvas.</td></tr>';

    const dataFmt = registro.criadoEm && registro.criadoEm.toDate
      ? registro.criadoEm.toDate().toLocaleString('pt-BR')
      : '—';
    document.getElementById('d-meta').textContent =
      `Salvo por ${registro.criadoPor || 'desconhecido'} em ${dataFmt}`;

    document.getElementById('overlay').classList.add('aberto');
  }

  function fecharDetalhe() {
    document.getElementById('overlay').classList.remove('aberto');
  }

  document.getElementById('btn-fechar').addEventListener('click', fecharDetalhe);
  document.getElementById('btn-fechar-2').addEventListener('click', fecharDetalhe);
  document.getElementById('overlay').addEventListener('click', (e) => {
    if (e.target.id === 'overlay') fecharDetalhe();
  });
  document.getElementById('btn-imprimir-detalhe').addEventListener('click', () => window.print());

  document.getElementById('btn-excluir-detalhe').addEventListener('click', async () => {
    if (!registroSelecionado) return;
    const n = normalizar(registroSelecionado);
    const confirmou = window.confirm(
      `Tem certeza que deseja excluir este acerto?\n\nMatrícula: ${n.matricula}\nNome: ${n.nome}\n\nEssa ação não pode ser desfeita.`
    );
    if (!confirmou) return;

    try {
      await excluirAcerto(registroSelecionado.id);
      fecharDetalhe();
      await carregar();
    } catch (err) {
      alert('Erro ao excluir: ' + err.message);
    }
  });

  document.getElementById('f-tipo').addEventListener('change', renderizarLista);
  document.getElementById('f-busca').addEventListener('input', renderizarLista);
</script>

</body>
</html>
